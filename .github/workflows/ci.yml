name: CI

on:
  push:
    branches: [main, beta-ready]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install uv
      - name: Install project
        run: uv sync --extra dev
      - name: Test
        run: uv run pytest
      - name: CLI smoke test
        run: |
          uv run lrc version
          uv run lrc --help
          uv run lrc discover --help
          uv run lrc fulltext --help
          uv run lrc blueprint --help
          uv run lrc package --help
          uv run lrc ai-use --help
      - name: Validate Windows installer syntax
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $content = Get-Content -Raw -Path .\install.ps1
          [void][ScriptBlock]::Create($content)
          if (-not (Test-Path .\commands\opencode\lr.md)) { throw "Missing OpenCode /lr wrapper" }
          if (-not (Test-Path .\commands\opencode\lr-status.md)) { throw "Missing OpenCode /lr-status wrapper" }
