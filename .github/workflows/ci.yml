name: CI

on:
  push:
    branches: [main, beta-ready, multi-host-macos-beta]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install uv
      - name: Install project
        run: uv sync --extra dev
      - name: Test
        run: uv run pytest
      - name: CLI smoke test
        run: |
          uv run lrc version
          uv run lrc --help
          uv run lrc discover --help
          uv run lrc fulltext --help
          uv run lrc blueprint --help
          uv run lrc package --help
          uv run lrc ai-use --help
      - name: Validate Windows installer and adapters
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $content = Get-Content -Raw -Path .\install.ps1
          [void][ScriptBlock]::Create($content)
          if (-not (Test-Path .\commands\opencode\lr.md)) { throw "Missing OpenCode /lr wrapper" }
          if (-not (Test-Path .\commands\claude\lr.md)) { throw "Missing Claude Code /lr wrapper" }
          if (-not (Test-Path .\commands\gemini\lr.toml)) { throw "Missing Gemini CLI /lr wrapper" }
      - name: Validate macOS installer and adapters
        if: runner.os == 'macOS'
        shell: bash
        run: |
          bash -n ./install.sh
          test -f ./commands/opencode/lr.md
          test -f ./commands/claude/lr.md
          test -f ./commands/gemini/lr.toml
          test -f ./commands/gemini/global-context.md
