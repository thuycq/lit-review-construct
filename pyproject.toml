[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "lit-review-construct"
version = "0.1.0.dev5"
description = "Local-first literature review construction toolkit"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Lit Review Construct contributors" }]
dependencies = [
  "typer>=0.16,<1",
  "pydantic>=2.11,<3",
  "PyYAML>=6.0,<7",
  "rich>=14,<15",
  "pypdf>=5.9,<6",
  "rapidfuzz>=3.13,<4",
  "httpx>=0.28,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
  "ruff>=0.12,<1",
]

[project.scripts]
lrc = "litreview_construct.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/litreview_construct"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
